
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeVerse Pro</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<nav class="navbar">
<div class="container nav-inner">

<div class="logo">
<i class="fa-solid fa-dragon"></i> AnimeVerse
</div>

<div class="nav-links">
<a href="#">Home</a>
<a href="#anime">Anime</a>
<a href="#apps">Apps</a>
<a href="#watchlist">Watchlist</a>
</div>

<div class="nav-actions">
<input id="search" placeholder="Search anime">
<button id="themeBtn"><i class="fa-solid fa-moon"></i></button>
</div>

</div>
</nav>


<section class="hero">

<div class="slider">

<div class="slide active">
<img src="https://cdn.myanimelist.net/images/anime/10/47347.jpg">
<div class="slide-text">
<h1>Attack on Titan</h1>
<p>The epic final battle begins.</p>
</div>
</div>

<div class="slide">
<img src="https://cdn.myanimelist.net/images/anime/1171/109222.jpg">
<div class="slide-text">
<h1>Jujutsu Kaisen</h1>
<p>Dark sorcery and powerful battles.</p>
</div>
</div>

<div class="slide">
<img src="https://cdn.myanimelist.net/images/anime/1286/99889.jpg">
<div class="slide-text">
<h1>Demon Slayer</h1>
<p>A breathtaking story of demons and swords.</p>
</div>
</div>

</div>

<div class="slider-dots">
<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

</section>


<section id="anime" class="section">

<h2>Popular Anime</h2>

<div id="animeGrid" class="grid"></div>

</section>


<section id="apps" class="section alt">

<h2>Anime Apps</h2>

<div id="appsGrid" class="grid"></div>

</section>


<section id="watchlist" class="section">

<h2>Your Watchlist</h2>

<div id="watchlistGrid" class="grid"></div>

</section>


<footer>
<p>AnimeVerse Pro © 2026</p>
</footer>


<script src="script.js"></script>

</body>
</html>
